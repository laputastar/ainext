name: Pilot - PH URL Resolve (multi-strategy probe)

# 实验用途：验证「跳过 Cloudflare / 搜索引擎反查」等方案能否从 PH /r/ 链接还原真实官网
# 评价标准：website_map.json 里已确认的真实官网作为标准答案，逐策略统计正确率
# 结论产出：日志末尾的对照表

on:
  workflow_dispatch:
    inputs:
      sample:
        description: '抽样条数'
        required: false
        type: number
        default: 12

jobs:
  pilot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests curl_cffi

      - name: Decompress tools.json
        run: gunzip -f tools.json.gz || echo "no gz found"

      - name: Run multi-strategy probe
        run: python resolve_search.py --validate ${{ github.event.inputs.sample || '20' }}
