name: Daily Update

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:
    inputs:
      force_translate:
        description: 'Force re-translate ALL tools (overwrite existing)'
        required: false
        type: boolean
        default: false
      backfill:
        description: 'Gentle backfill of unresolved website URLs (lower rate, avoids Cloudflare 429)'
        required: false
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    # 翻译走 150 分钟预算，整体留足缓冲；真超过 330 分钟说明异常，宁可失败也不要挂死
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      # 凭证用内置 GITHUB_TOKEN：随 Job 自动签发、永不过期
      # 不用手工 PAT（secrets.GH_TOKEN），否则 PAT 到期会直接卡死 checkout
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests aiohttp

      - name: Decompress tools.json (if gz exists)
        run: |
          if [ -f tools.json.gz ]; then
            gunzip -f tools.json.gz
            echo "✅ 已解压 tools.json.gz"
          else
            echo "ℹ️ 无 gz，使用仓库内 tools.json（首次迁移）"
          fi

      - name: Save prev snapshot for KV diff
        run: |
          cp tools.json tools.prev.json
          echo "✅ 已保存上一轮快照 tools.prev.json"

      - name: Fetch latest data
        run: python fetch_ph_data.py
        env:
          RESOLVE_WORKERS: ${{ github.event.inputs.backfill == 'true' && '3' || '5' }}
          RESOLVE_DELAY: ${{ github.event.inputs.backfill == 'true' && '1.5' || '0' }}
          RESOLVE_RETRY_HOURS: ${{ github.event.inputs.backfill == 'true' && '0' || '24' }}

      - name: Translate new tools (concurrent LLM)
        # 时间预算：到点收尾并落盘提交，剩余留给下一轮，避免撞 job 硬超时导致全轮作废
        run: python translate_concurrent.py tools.json ${{ github.event.inputs.force_translate == 'true' && '--force' || '' }}
        env:
          TRANSLATE_BUDGET_MIN: '150'
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM45_API_KEY: ${{ secrets.GLM45_API_KEY }}
          GLM46_API_KEY: ${{ secrets.GLM46_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

      - name: Push updates to KV
        run: python push_kv.py tools.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NAMESPACE_ID: 98eda5ab9ffa4e788aef7058998bc280

      - name: Compress tools.json before commit
        run: |
          rm -f tools.prev.json
          gzip -f tools.json
          echo "✅ 已压缩 tools.json → tools.json.gz ($(du -h tools.json.gz | cut -f1))"

      - name: Commit & push if changed
        run: |
          git config user.name "AINext Bot"
          git config user.email "bot@ainext.com"
          # website_fail.json 已随 PH 解析器停用而废弃（不再产生新记录），不再纳入提交
          git add tools.json.gz tools-slim.json sitemap.xml website_map.json
          git diff --staged --quiet || (git commit -m "Daily update: $(date +%Y-%m-%d)" && git pull --rebase --autostash && git push)
